<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>text dump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#222;font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:clamp(20px,5vw,48px);min-height:100vh}form{display:flex;flex-direction:column;min-height:calc(100vh - 96px)}textarea{display:block;width:100%;min-height:60vh;flex:1;resize:vertical;border:0;outline:0;padding:0;background:#fff;color:#222;font:16px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}textarea:focus-visible{outline:1px solid #dedede;outline-offset:8px}.controls{display:flex;align-items:center;gap:18px;margin-top:24px}button{font:inherit;background:#593a9a;color:#fff;border:1px solid #593a9a;border-radius:3px;padding:8px 18px;cursor:pointer}button:hover:not(:disabled){background:#482b83;border-color:#482b83}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible{outline:2px solid #777;outline-offset:4px}details{font-size:12px;color:#777}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'+ ';}details[open] summary::before{content:'− '}.explanation{max-width:540px;font-size:13px;line-height:1.6;color:#666;margin-top:16px}.explanation p{margin:8px 0}.status{font-size:12px;color:#777;margin:10px 0 0;min-height:1em}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){main{padding:24px}form{min-height:calc(100vh - 48px)}}
@media(prefers-color-scheme:dark){html,body,textarea{background:#1e1e1e;color:#e8e6ed}textarea:focus-visible{outline-color:#625d6d}button{background:#7855b7;border-color:#7855b7;color:#fff}button:hover:not(:disabled){background:#8b68ca;border-color:#8b68ca}details,.explanation,.status{color:#b6b1bf}button:focus-visible,summary:focus-visible{outline-color:#c3a9f2}}
</style>
</head>
<body>
<main>
  <form id="post-form">
    <label class="sr-only" for="entry" data-text="label">Your note</label>
    <textarea id="entry" name="entry" autofocus></textarea>
    <div class="controls">
      <button type="submit" id="post" disabled>dump</button>
      <details><summary data-text="about">about</summary><div class="explanation">
        <p data-text="intro">Capture a thought, then keep it as a Markdown note.</p>
        <p data-text="hint">Markdown is welcome.</p>
        <p data-text="privacy">Your note stays in your browser until you download it. Drafts are not saved.</p>
        <p data-text="download">Your browser may ask for permission to download or where to save the file.</p>
      </div></details>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(() => {
  const translations = {
    en:{about:'about',title:'A little space to write.',intro:'Capture a thought, then keep it as a Markdown note.',label:'Your note',placeholder:"What's on your mind?",hint:'Markdown is welcome.',post:'Post',privacy:'Your note stays in your browser until you download it. Drafts are not saved.',download:'Your browser may ask for permission to download or where to save the file. If you cancel, the input has already been cleared.',done:'Download requested.',error:'Could not start the download. Your note is still here.'},
    ja:{about:'説明',title:'ひとこと、書きとめる。',intro:'思いついたことを、Markdownのノートとして残しましょう。',label:'ノート',placeholder:'いま、何を考えていますか？',hint:'Markdownで入力できます。',post:'投稿',privacy:'ノートはブラウザ内で処理されます。下書きは保存されません。',download:'ブラウザによってはダウンロードの許可や保存先を確認されます。キャンセルしても入力欄はすでに消去されています。',done:'ダウンロードを要求しました。',error:'ダウンロードを開始できませんでした。入力内容は残っています。'},
    zh:{about:'说明',title:'写下此刻的想法。',intro:'记录一个念头，将它保存为 Markdown 笔记。',label:'你的笔记',placeholder:'此刻在想什么？',hint:'支持 Markdown。',post:'发布',privacy:'笔记在浏览器中处理。草稿不会保存。',download:'浏览器可能会询问下载权限或保存位置。取消时输入内容也已清除。',done:'已请求下载。',error:'无法开始下载，笔记仍保留在输入框中。'},
    es:{about:'información',title:'Un espacio para escribir.',intro:'Guarda una idea como una nota Markdown.',label:'Tu nota',placeholder:'¿Qué estás pensando?',hint:'Puedes usar Markdown.',post:'Publicar',privacy:'La nota se procesa en tu navegador. Los borradores no se guardan.',download:'El navegador puede pedir permiso para descargar o preguntar dónde guardar. Si cancelas, el texto ya se habrá borrado.',done:'Descarga solicitada.',error:'No se pudo iniciar la descarga. Tu nota sigue aquí.'},
    ko:{about:'설명',title:'생각을 잠시 적어 두세요.',intro:'떠오른 생각을 Markdown 노트로 간직하세요.',label:'내 노트',placeholder:'지금 무슨 생각을 하고 있나요?',hint:'Markdown을 사용할 수 있습니다.',post:'게시',privacy:'노트는 브라우저에서 처리됩니다. 임시 저장은 하지 않습니다.',download:'브라우저에서 다운로드 권한이나 저장 위치를 물을 수 있습니다. 취소해도 입력 내용은 이미 지워집니다.',done:'다운로드를 요청했습니다.',error:'다운로드를 시작하지 못했습니다. 입력한 내용은 그대로 남아 있습니다.'}
  };
  const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  const language = preferred.map(x => String(x).toLowerCase().split('-')[0]).find(x => Object.hasOwn(translations, x)) || 'en';
  const t = translations[language];
  document.documentElement.lang = language;
  document.querySelectorAll('[data-text]').forEach(el => { el.textContent = t[el.dataset.text]; });
  document.querySelectorAll('[data-placeholder]').forEach(el => { el.placeholder = t[el.dataset.placeholder]; });
  const form = document.getElementById('post-form'), entry = document.getElementById('entry'), button = document.getElementById('post'), status = document.getElementById('status');
  entry.addEventListener('input', () => { button.disabled = !entry.value.trim(); status.textContent = ''; });
  const pad = n => String(n).padStart(2, '0');
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (!entry.value.trim()) return;
    const now = new Date();
    const date = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const offset = -now.getTimezoneOffset();
    const zone = `${offset >= 0 ? '+' : '-'}${pad(Math.floor(Math.abs(offset)/60))}:${pad(Math.abs(offset)%60)}`;
    const content = `---\ncreated: "${date}T${time}${zone}"\ntags: [microjournal]\n---\n\n${entry.value}\n`;
    let url;
    try {
      url = URL.createObjectURL(new Blob([content], {type:'text/markdown;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url;
      const firstLine = entry.value.split(/\r?\n/, 1)[0];
      const title = Array.from(firstLine).slice(0, 10).join('').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').trim().replace(/[. ]+$/g, '');
      link.download = `${date}_${time.replaceAll(':','-')}${title ? '_' + title : ''}.md`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      entry.value = '';
      button.disabled = true;
      status.textContent = t.done;
      entry.focus();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (_) {
      if (url) URL.revokeObjectURL(url);
      status.textContent = t.error;
    }
  });
})();
</script>
</body>
</html>
